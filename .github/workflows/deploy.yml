# 브랜치에 푸시할 때마다 게임을 빌드해서 GitHub Pages 에 올린다.
# 처음 한 번은 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꿔줘야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mobile-game-development-dw69ij
  # Actions 탭에서 손으로 돌릴 수도 있게 해 둔다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 앞선 배포를 중간에 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 게임 로직 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Pages 가 아직 켜져 있지 않으면 이 워크플로가 직접 켠다.
          # (저장소 Settings 를 손으로 만질 필요가 없다)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
