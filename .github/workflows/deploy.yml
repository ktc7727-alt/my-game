# 브랜치에 푸시할 때마다 게임을 빌드해서 GitHub Pages 에 올린다.
# 처음 한 번은 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꿔줘야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    # github-pages 환경은 기본 브랜치에서만 배포를 허용한다.
    # 다른 브랜치를 넣으면 build 는 통과하고 deploy 만 막혀 실패 알림이 쌓인다.
    branches:
      - main
  # Actions 탭에서 손으로 돌릴 수도 있게 해 둔다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 앞선 배포를 중간에 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 게임 로직 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      # enablement: true 로 Pages 를 자동으로 켜보려 했지만
      # GITHUB_TOKEN 에는 Pages 생성 권한이 없어 막힌다
      # ("Resource not accessible by integration").
      # 그래서 최초 1회는 저장소 Settings > Pages 에서 손으로 켜야 한다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
